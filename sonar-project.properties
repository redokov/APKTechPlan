# SonarQube: АПК «Планирование техники» (расширение CFE + внешние обработки EPF)
# URL/токен Sonar задаются в Jenkins через sonarQubeInstallation=sonarqube10
sonar.projectKey=APKTechPlan
sonar.projectName=APKTechPlan — Планирование техники АПК
sonar.projectVersion=1.0.0

# Источники: XML-выгрузка расширения (Ext/*.bsl, Form/Module.bsl) и EPF
sonar.sources=./src
sonar.inclusions=**/*.bsl,**/*.os
sonar.sourceEncoding=UTF-8
sonar.text.inclusions=**/*.bsl

# Выгрузка 1С содержит дублирующиеся бинарные/служебные артефакты — не анализируем
sonar.exclusions=**/*.xml,**/*.mxl,**/*.erf,**/*.epf,**/*.json
